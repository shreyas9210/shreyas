<!DOCTYPE html>
<html>
<head>
<title>Contact - GPK</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Segoe UI;
margin:0;
background:#eef2f7;
}

.header{
background:#002147;
color:white;
text-align:center;
padding:30px;
}

.container{
max-width:600px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

input, textarea{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#0055a5;
color:white;
padding:10px;
border:none;
width:100%;
border-radius:5px;
font-size:16px;
}

button:hover{
background:#003366;
}

.info{
margin-top:20px;
color:#444;
}

.btn{
display:inline-block;
margin-top:20px;
padding:10px 20px;
background:#0055a5;
color:white;
text-decoration:none;
border-radius:25px;
}

</style>
</head>

<body>

<div class="header">
<h1>Contact Us</h1>
</div>

<div class="container">

<form>
<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Your Email" required>
<textarea rows="4" placeholder="Your Message"></textarea>
<button type="submit">Send Message</button>
</form>

<div class="info">
<p><b>Address:</b> Karad, Satara, Maharashtra</p>
<p><b>Email:</b> gpk@edu.in</p>
<p><b>Phone:</b> +91 1234567890</p>
</div>
<footer>
	<a href="website.html" class="btn"> Back To Home</a>
</footer>

</body>
</html>
